services:
  mysql:
    image: mysql:8.0
    container_name: mysql-docker
    environment:
      MYSQL_ROOT_PASSWORD: Root123$
      MYSQL_DATABASE: update_carwash_db
    ports:
      - "3308:3306"

  app:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DB_NAME: update_carwash_db
      MYSQL_USER: root
      MYSQL_PASSWORD: Root123$
    depends_on:
      - mysql
    ports:
      - "8080:8080"
