server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql-docker:3306/update_carwash_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Root123$}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

springdoc:
  swagger-ui:
    path: /swagger

app:
  jwt:
    secret: THIS_IS_MY_SUPER_SECRET_KEY_ChangeIt1234567890
    expiration-ms: 86400000
  admin:
    name: Super Admin
    phone: 9999999999
    password: admin123

cors:
  allowed-origins:
    - "http://localhost:3000"
    - "http://localhost:3001"
    - "http://localhost:5173"
  allowed-methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allowed-headers:
    - "*"
