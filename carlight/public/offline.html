<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're Offline — CarLight</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eff6ff, #f8fafc);
      color: #1f2937;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 30px rgba(37, 99, 235, 0.12);
    }
    .icon {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: #dbeafe;
      display: flex; align-items: center; justify-content: center;
      font-size: 34px;
      margin: 0 auto 1.25rem;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.6rem; color: #111827; }
    p { font-size: 0.95rem; color: #6b7280; line-height: 1.55; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(90deg, #2563eb, #3b82f6);
      color: #fff; border: 0; border-radius: 10px;
      padding: 0.8rem 2rem; font-size: 1rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
    }
    button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You're offline</h1>
    <p>
      No internet connection right now. Pages you visited recently may still
      work — otherwise check your connection and try again.
    </p>
    <button onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
